<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing Detector</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      display: grid; 
      place-items: center; 
      padding: 24px; 
      background-color: #0a0a0c; 
      color: #edf2ff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      overflow-x: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      z-index: -1;
      filter: blur(80px);
      pointer-events: none;
    }
    body::before {
      width: 400px; height: 400px;
      background: rgba(255, 255, 255, 0.04);
      top: -10%; left: 15%;
    }
    body::after {
      width: 500px; height: 500px;
      background: rgba(255, 255, 255, 0.03);
      bottom: -15%; right: -5%;
    }

    main { 
      width: min(100%, 680px); 
      padding: 42px; 
      background: rgba(255, 255, 255, 0.04); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 24px; 
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 1;
    }

    .eyebrow { 
      color: #a3b8e0; 
      font-weight: 600; 
      letter-spacing: .1em; 
      text-transform: uppercase; 
      font-size: .75rem; 
      opacity: 0.8;
    }
    
    h1 { 
      margin: 10px 0; 
      font-size: clamp(2rem, 6vw, 3rem); 
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    
    p { color: #9ba8c8; line-height: 1.6; }
    
    form { display: flex; gap: 12px; margin-top: 32px; }
    
    input { 
      min-width: 0; 
      flex: 1; 
      padding: 16px 20px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 12px; 
      background: rgba(0, 0, 0, 0.2); 
      color: #fff; 
      font-size: 1rem; 
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.3); }
    input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
    }
    
    button { 
      border: 0; 
      border-radius: 12px; 
      padding: 0 28px; 
      background: #ffffff; 
      color: #000000; 
      font-size: 1rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }
    button:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: none; }
    
    #result { 
      display: none; 
      margin-top: 24px; 
      padding: 18px 20px; 
      border-radius: 12px; 
      font-weight: 600; 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #result.legitimate { background: rgba(18, 61, 48, 0.4); color: #8ce1b2; border-color: rgba(140, 225, 178, 0.2); }
    #result.phishing { background: rgba(77, 32, 43, 0.4); color: #ff9fa9; border-color: rgba(255, 159, 169, 0.2); }
    #result.error { background: rgba(75, 59, 23, 0.4); color: #fce28b; border-color: rgba(252, 226, 139, 0.2); }
    
    details { 
      margin-top: 32px; 
      padding: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 12px; 
      background: rgba(0, 0, 0, 0.15); 
      transition: background 0.3s;
    }
    details[open] { background: rgba(255, 255, 255, 0.03); }
    summary { color: #dce6ff; font-weight: 600; cursor: pointer; user-select: none; }
    details p, details ul { margin: 14px 0 0; color: #9ba8c8; }
    details li { margin: 8px 0; line-height: 1.5; }
    
    .note {
